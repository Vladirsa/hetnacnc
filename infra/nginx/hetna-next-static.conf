# Archivos de Next (/_next/static/): se pasan a la tienda con la ruta YA
# DECODIFICADA. Va DENTRO del server de hetnacnc.com, antes de "location / {".
#
# Por qué (11 nov 2026): los navegadores (Chrome/Googlebot) llegaron pidiendo
# /_next/static/chunks/app/%5Blocale%5D/%28main%29/page-….js, con los
# paréntesis codificados. Next sólo encuentra el archivo si llegan como
# "(main)": con %28/%29 responde 404, la página no carga su JavaScript y sale
# "¡Algo salió mal!" con el menú desarmado. Con una variable en proxy_pass,
# nginx manda $uri (ya decodificado: %28 → "(") en vez de la ruta original.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
