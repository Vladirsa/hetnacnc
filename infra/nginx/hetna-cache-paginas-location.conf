# Va DENTRO del location que hace proxy_pass a la tienda (puerto 3000), con:
#     include /root/hetnacnc/infra/nginx/hetna-cache-paginas-location.conf;
# Requiere hetna-cache-paginas.conf en /etc/nginx/conf.d/.
#
# Sin add_header a propósito: un add_header dentro del location haría que nginx
# deje de mandar los add_header del server (HSTS, seguridad, etc.).

proxy_cache            hetna_paginas;
# El idioma cambia el HTML: va en la llave ($hetna_idioma, ver el otro archivo).
proxy_cache_key        "$scheme$host$request_uri|$hetna_idioma";
proxy_cache_bypass     $hetna_saltar_cache;
proxy_no_cache         $hetna_saltar_cache;

# Next manda "no-store" en todo; aquí se decide por tiempo.
proxy_ignore_headers   Cache-Control Expires;
proxy_cache_valid      200 301 308 60s;
proxy_cache_valid      404 10s;

# Si la tienda o el API fallan (despliegue, caída), se sirve la última copia
# buena hasta por 24 h (inactive del proxy_cache_path) en vez del error.
proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
# Si 50 personas piden la misma página vencida, sólo una llega a la tienda.
proxy_cache_lock       on;
proxy_cache_lock_timeout 5s;
