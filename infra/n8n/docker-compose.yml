name: hetnacnc-automation

# Pensado para correr junto al stack real de hetnacnc.com (nginx + certbot en
# el host, Postgres/Redis de Medusa ya en Docker en 5432/6379). Por eso NO
# trae su propio Caddy/reverse proxy: n8n y evolution-api solo escuchan en
# 127.0.0.1 y es nginx (ya instalado en el VPS) el que expone los subdominios
# con TLS, igual que hace hoy con hetnacnc.com.

services:
  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      # Permite que n8n llame al backend de Medusa (PM2, puerto 9000 en el
      # host) sin salir a internet y sin depender de nginx.
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Mexico_City}
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      # Variables usadas dentro de los workflows (nodos HTTP Request / Code) vía $env.*
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://host.docker.internal:9000}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      MEDUSA_REGION_ID: ${MEDUSA_REGION_ID}
      MEDUSA_ADMIN_SECRET_KEY: ${MEDUSA_ADMIN_SECRET_KEY}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://hetnacnc.com}
      ABANDONED_CART_MIN_HOURS: ${ABANDONED_CART_MIN_HOURS:-3}
      ABANDONED_CART_MAX_HOURS: ${ABANDONED_CART_MAX_HOURS:-72}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n-postgres

  evolution-api:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      LOG_LEVEL: ERROR
    volumes:
      - evolution_data:/evolution/instances

volumes:
  n8n_data:
  n8n_postgres_data:
  evolution_data:
