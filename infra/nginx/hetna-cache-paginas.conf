# Microcaché de páginas públicas de la tienda (nivel http: va en /etc/nginx/conf.d/).
# Se completa con hetna-cache-paginas-location.conf, que se incluye DENTRO del
# location que hace proxy_pass a la tienda (Next, puerto 3000).
#
# Por qué: la tienda arma cada página desde cero en cada visita (el layout lee
# cookies y Next responde no-store). La prueba de capacidad del 11 de noviembre
# topó en ~6 páginas por segundo. Con esto, una página se arma como mucho una
# vez por minuto y el resto de las visitas sale de nginx.
#
# Qué NO se guarda (se pide siempre a la tienda):
#   - quien tiene sesión o panel (_medusa_jwt, hetna_panel)
#   - (quien tiene carrito recibe copias, pero sus respuestas no se guardan)
#   - todo lo que no sea GET/HEAD (formularios y server actions son POST)
#   - navegación interna de Next (cabecera RSC): sólo se guarda la carga completa
#   - ligas con ?ref= (la tienda tiene que poner la cookie de recomendación)
#   - cualquier ruta fuera de la lista permitida ($hetna_ruta_publica)
#   - respuestas con Set-Cookie (regla por omisión de nginx: nunca se guardan)

proxy_cache_path /var/cache/nginx/hetna-paginas levels=1:2 keys_zone=hetna_paginas:20m
                 max_size=1g inactive=24h use_temp_path=off;

map $http_cookie $hetna_con_sesion {
    default 0;
    "~*(^|;\s*)(_medusa_jwt|hetna_panel)=" 1;
}

# Quien tiene carrito RECIBE copias pero nunca las CREA (proxy_no_cache). Desde
# el 11 nov el HTML no trae el carrito (lo pide el navegador, CartProvider),
# así que la copia de otro le sirve igual. Que no las cree es la red de
# seguridad: si nginx se actualiza antes que la tienda, o se vuelve a un build
# viejo que todavía metía el carrito en el HTML, ese HTML nunca se guarda.
map $http_cookie $hetna_con_carrito {
    default 0;
    "~*(^|;\s*)_medusa_cart_id=" 1;
}

map $request_method $hetna_no_get {
    GET     0;
    HEAD    0;
    default 1;
}

map $http_rsc $hetna_es_rsc {
    ""      0;
    default 1;
}

map $args $hetna_con_ref {
    default          0;
    "~(^|&)ref="     1;
}

# Sólo se guardan estas rutas (lista permitida): inicio, catálogo, fichas y
# páginas informativas. Se revisó que ninguna lea cookies de sesión ni carrito
# por su cuenta (11 nov 2026). Una página nueva NO entra hasta agregarla aquí.
map $uri $hetna_ruta_publica {
    default 0;
    "~^/[a-z]{2}/?$" 1;
    "~^/[a-z]{2}/(categories|collections|products)(/|$)" 1;
    "~^/[a-z]{2}/(talleres|herramientas-cnc|aprendizaje-cnc|calculadora-cnc|distribuidores|fabricacion)/?$" 1;
    "~^/[a-z]{2}/(quienes-somos|preguntas-frecuentes|formas-de-pago|devoluciones|aviso-de-privacidad|terminos-y-condiciones|terminos-vendedores)/?$" 1;
}

# Robots ven otro listado en categorías (isBot en lib/helpers/isBot.ts):
# misma expresión, y sin user-agent también cuenta como robot.
map $http_user_agent $hetna_es_bot {
    ""                                              1;
    "~*(bot|crawl|spider|slurp|bing|duckduckbot|GPTBot)" 1;
    default                                         0;
}

# Los clics de anuncios llegan con gclid / fbclid / utm_* distintos en cada
# visita. Si la consulta trae SÓLO esos parámetros, la llave los ignora (la
# página que se arma es la misma; los lee el JavaScript de analítica).
map $args $hetna_args_llave {
    "~^((utm_[a-z_]+|gclid|fbclid|gbraid|wbraid|msclkid|ttclid|_gl|igshid|mc_cid|mc_eid)=[^&]*&?)+$" "";
    default $args;
}

# Idioma con que se arma la página (app/layout.tsx): la cookie hetna_lang si
# existe; sin ella, /us sale en inglés y todo lo demás en español. Así un
# visitante nuevo (sin cookies, el tráfico de anuncios) comparte la copia de
# quien ya eligió el mismo idioma.
map "$cookie_hetna_lang|$uri" $hetna_idioma {
    "~^en\|"          en;    # eligió inglés
    "~^[^|]+\|"       es;    # eligió otro (el layout sólo distingue en / no en)
    "~^\|/us(/|$)"    en;    # sin elegir, en /us
    default           es;    # sin elegir, cualquier otra región
}

map "$hetna_con_sesion$hetna_no_get$hetna_es_rsc$hetna_con_ref$hetna_ruta_publica" $hetna_saltar_cache {
    "00001" 0;
    default 1;
}

map "$hetna_saltar_cache$hetna_con_carrito" $hetna_no_guardar {
    "00"    0;
    default 1;
}
