# /static sin páginas ni scripts (auditoría de seguridad del 18 nov 2026).
#
# Va DENTRO del server de hetnacnc.com (junto a los otros include de HETNA):
#     include /root/hetnacnc/infra/nginx/hetna-static-seguro.conf;
#
# En /static vive lo que suben los talleres y el panel. El API ya rechaza los
# .html, .svg y scripts al subirlos (src/modules/archivo-local-seguro); esto es
# la segunda barrera, por si quedó alguno de antes o alguien lo copia a mano:
# nginx responde 403 y el archivo nunca llega a un navegador con la sesión del
# administrador. Las fotos, videos y PDF se siguen viendo igual.
location ~* ^/static/.*\.(html?|xhtml|xht|shtml|mht|mhtml|hta|svgz?|xml|xsl|xslt|js|mjs|cjs|php|phtml|swf|exe|msi|bat|cmd|scr|ps1|vbs|jar|lnk|iso)$ {
    return 403;
}
