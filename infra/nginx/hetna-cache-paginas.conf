# Microcaché de páginas públicas de la tienda (nivel http: va en /etc/nginx/conf.d/).
# Se completa con hetna-cache-paginas-location.conf, que se incluye DENTRO del
# location que hace proxy_pass a la tienda (Next, puerto 3000).
#
# Por qué: la tienda arma cada página desde cero en cada visita (el layout lee
# cookies y Next responde no-store). La prueba de capacidad del 11 de noviembre
# topó en ~6 páginas por segundo. Con esto, una página se arma como mucho una
# vez por minuto y el resto de las visitas sale de nginx.
#
# Qué NO se guarda (se pide siempre a la tienda):
#   - quien tiene sesión, carrito o panel (_medusa_jwt, _medusa_cart_id, hetna_panel)
#   - todo lo que no sea GET/HEAD (formularios y server actions son POST)
#   - navegación interna de Next (cabecera RSC): sólo se guarda la carga completa
#   - ligas con ?ref= (la tienda tiene que poner la cookie de recomendación)
#   - rutas personales o de API (ver $hetna_ruta_privada)
#   - respuestas con Set-Cookie (regla por omisión de nginx: nunca se guardan)

proxy_cache_path /var/cache/nginx/hetna-paginas levels=1:2 keys_zone=hetna_paginas:20m
                 max_size=1g inactive=24h use_temp_path=off;

map $http_cookie $hetna_con_sesion {
    default 0;
    "~*(^|;\s*)(_medusa_jwt|_medusa_cart_id|hetna_panel)=" 1;
}

map $request_method $hetna_no_get {
    GET     0;
    HEAD    0;
    default 1;
}

map $http_rsc $hetna_es_rsc {
    ""      0;
    default 1;
}

map $args $hetna_con_ref {
    default          0;
    "~(^|&)ref="     1;
}

map $uri $hetna_ruta_privada {
    default 0;
    "~^/(api|r|_next/data|dashboard|seller|store|auth|admin|app)(/|$)" 1;
    "~^/[a-z]{2}/(user|cart|checkout|mensajes|favoritos|panel|mi-|mis-|reset-password|cotizador|cam/lab)" 1;
}

# Idioma con que se arma la página (app/layout.tsx): la cookie hetna_lang si
# existe; sin ella, /us sale en inglés y todo lo demás en español. Así un
# visitante nuevo (sin cookies, el tráfico de anuncios) comparte la copia de
# quien ya eligió el mismo idioma.
map "$cookie_hetna_lang|$uri" $hetna_idioma {
    "~^en\|"          en;    # eligió inglés
    "~^[^|]+\|"       es;    # eligió otro (el layout sólo distingue en / no en)
    "~^\|/us(/|$)"    en;    # sin elegir, en /us
    default           es;    # sin elegir, cualquier otra región
}

map "$hetna_con_sesion$hetna_no_get$hetna_es_rsc$hetna_con_ref$hetna_ruta_privada" $hetna_saltar_cache {
    "00000" 0;
    default 1;
}
