# Redirección www.hetnacnc.com → hetnacnc.com (auditoría SEO del 13 nov 2026).
# Los dos dominios respondían 200 con el mismo contenido: Google veía dos
# copias de cada página. La canónica ya era hetnacnc.com (sin www).
#
# Va en el contexto http: cópialo a /etc/nginx/conf.d/hetna-www.conf (nginx
# carga conf.d/*.conf). Se completa con hetna-www-location.conf, que va DENTRO
# del server de hetnacnc.com.
#
# Sólo páginas pedidas con GET o HEAD. NO se redirigen:
#   - POST/PUT/… (un 301 convierte un envío de formulario en GET y lo pierde);
#   - API, webhooks, feeds de catálogo y estáticos: Mercado Pago, PayPal,
#     WhatsApp o Google/Meta pueden tener registrada una dirección con www y
#     muchos no siguen redirecciones.
map "$request_method:$host:$request_uri" $hetna_www_redirige {
    default 0;
    "~^(GET|HEAD):www\.hetnacnc\.com:/(?!api/|store/|hooks/|admin/|vendor/|auth/|webhooks?/|feeds/|_next/|dashboard|seller|r/)" 1;
}
