# Versión web del Cotizador HETNA (Flutter web) en https://hetnacnc.com/cotizador/
# La sube el workflow "build-web" del repo Vladirsa/Cotizador a /var/www/cotizador.
#
# Pegar DENTRO del bloque `server { ... }` de hetnacnc.com (puerto 443) en
# /etc/nginx/sites-available/hetnacnc.com, ANTES de `location / { ... }`.
# Luego: nginx -t && systemctl reload nginx

location = /cotizador { return 301 /cotizador/; }

location ^~ /cotizador/ {   # ^~ gana a cualquier location con regex del servidor
    # root (no alias): /cotizador/x → /var/www/cotizador/x, y las location de
    # abajo heredan la carpeta sin el bug de alias + try_files
    root /var/www;
    try_files $uri $uri/ /cotizador/index.html;

    # index.html, main.dart.js y service worker sin caché (si no, el navegador
    # se queda con la versión vieja después de cada build)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # fuentes, íconos y canvaskit sí se guardan
    location ~* \.(wasm|png|ttf|otf|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
