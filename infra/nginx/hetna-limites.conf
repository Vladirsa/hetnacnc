# Límite de intentos de inicio de sesión, registro y cambio de contraseña.
# Va en /etc/nginx/conf.d/ (nivel http): cuenta SÓLO los POST a esas rutas;
# para todo lo demás la llave queda vacía y nginx no limita nada.
#
# 10 intentos por minuto por IP, con 10 de margen: una persona real nunca lo
# toca; un robot que prueba contraseñas recibe 429 ("demasiadas peticiones").
#
# Cubre el API directo (/auth/.../emailpass) y los formularios de la tienda,
# que llegan como POST (server actions) a /<pais>/user y /<pais>/user/register.
map $request_method $hetna_es_post {
    POST    1;
    default "";
}

map "$hetna_es_post:$request_uri" $hetna_llave_login {
    default "";
    "~^1:/auth/(customer|seller|user|member)/emailpass"   $binary_remote_addr;
    "~^1:/auth/[^?]*/(reset-password|update|register)"   $binary_remote_addr;
    "~^1:/[a-z]{2}/user(/register)?/?(\?.*)?$"            $binary_remote_addr;
    # Recuperar y cambiar contraseña desde la tienda (auditoría del 18 nov 2026):
    # el formulario llama al API por dentro del servidor, así que la regla de
    # /auth/.../reset-password no lo veía
    "~^1:/[a-z]{2}/(forgot-password|reset-password|activar)" $binary_remote_addr;
}

limit_req_zone $hetna_llave_login zone=hetna_login:10m rate=10r/m;
limit_req zone=hetna_login burst=10 nodelay;
limit_req_status 429;

# ── Rutas públicas y costosas (auditoría del 18 nov 2026) ────────────────────
# Conversión y cálculo de CAM, fotos para escanear, estimaciones del cotizador
# en línea, registro de talleres y subida de archivos sin sesión: cada una gasta
# CPU, disco o IA. 30 por minuto por IP con 30 de margen: un cliente real no lo
# toca; un robot recibe 429.
map "$hetna_es_post:$request_uri" $hetna_llave_costosa {
    default "";
    "~^1:/store/cam/"                      $binary_remote_addr;
    "~^1:/api/cam/"                        $binary_remote_addr;
    "~^1:/api/taller/"                     $binary_remote_addr;
    "~^1:/api/taller-publico/"             $binary_remote_addr;
    "~^1:/store/talleres-registro"         $binary_remote_addr;
    "~^1:/store/solicitud-archivos"        $binary_remote_addr;
    "~^1:/store/solicitudes-taller"        $binary_remote_addr;
    "~^1:/hooks/(verificar-correo|alta-taller)" $binary_remote_addr;
}

limit_req_zone $hetna_llave_costosa zone=hetna_costosa:10m rate=30r/m;
limit_req zone=hetna_costosa burst=30 nodelay;
