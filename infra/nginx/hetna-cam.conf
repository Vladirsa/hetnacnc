# Tamaño máximo de lo que sube el CAM Studio.
# Va en /etc/nginx/conf.d/ (nivel http), junto a hetna-limites.conf.
#
# Sin esto nginx corta en 1 MB y fallan con error 413:
#   - los trabajos 3D grandes al armar el G-code (/api/cam/post, hasta 12 MB)
#   - guardar un proyecto 3D con su malla (/api/cam/proyectos, hasta 1.8 MB)
#   - los DXF pesados del CAM 2D (/api/cam/gcode, hasta 4 MB)
#
# Si el bloque de hetnacnc.com ya trae su propio client_max_body_size, ese
# manda y este archivo no hace falta. Si `nginx -t` avisa que la directiva
# está duplicada, es que ya está puesta en nginx.conf: borra este archivo.
client_max_body_size 16m;
