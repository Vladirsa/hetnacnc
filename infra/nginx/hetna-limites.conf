# Límite de intentos de inicio de sesión, registro y cambio de contraseña.
# Va en /etc/nginx/conf.d/ (nivel http): cuenta SÓLO los POST a esas rutas;
# para todo lo demás la llave queda vacía y nginx no limita nada.
#
# 10 intentos por minuto por IP, con 10 de margen: una persona real nunca lo
# toca; un robot que prueba contraseñas recibe 429 ("demasiadas peticiones").
#
# Cubre el API directo (/auth/.../emailpass) y los formularios de la tienda,
# que llegan como POST (server actions) a /<pais>/user y /<pais>/user/register.
map $request_method $hetna_es_post {
    POST    1;
    default "";
}

map "$hetna_es_post:$request_uri" $hetna_llave_login {
    default "";
    "~^1:/auth/(customer|seller|user|member)/emailpass"   $binary_remote_addr;
    "~^1:/auth/[^?]*/(reset-password|update|register)"   $binary_remote_addr;
    "~^1:/[a-z]{2}/user(/register)?/?(\?.*)?$"            $binary_remote_addr;
}

limit_req_zone $hetna_llave_login zone=hetna_login:10m rate=10r/m;
limit_req zone=hetna_login burst=10 nodelay;
limit_req_status 429;
